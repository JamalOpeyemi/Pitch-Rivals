<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Rivals Beta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Pitch Rivals Beta</h1>

    <!-- SCREEN 1: the game -->
    <div id="game">
      <section class="scoreboard">
        <div>You <span id="player-score">0</span></div>
        <div>CPU <span id="cpu-score">0</span></div>
      </section>

      <p id="round-info"></p>
      <p id="message"></p>

      <section class="battlefield">
        <div class="slot">
          <p class="slot-label">You</p>
          <div id="player-slot"></div>
        </div>
        <div class="slot">
          <p class="slot-label">Computer</p>
          <div id="cpu-slot"></div>
        </div>
      </section>

      <button id="next-btn" hidden>Next Round</button>
    </div>

    <!-- SCREEN 2: the results -->
    <section id="results" hidden>
      <p class="results-label">Full time</p>
      <h2 id="result-title" class="result-title"></h2>
      <p id="final-score"></p>
      <p id="result-text"></p>
      <button id="play-again-btn">Play Again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
